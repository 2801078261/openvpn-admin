<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenVPN Access Server</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--side:#1e3a5f;--side2:#172e4c;--orange:#e67e22;--blue:#3498db;--line:#dde3ea;
--muted:#5b6c80;--text:#333;--row:#f2f3f4;--bg:#f8fafc;--green:#1e8e5a;--red:#c0392b;}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;color:var(--text);font-size:14px;background:var(--bg);}
a{color:var(--blue);text-decoration:none;}

/* 登录页 */
#loginView{position:fixed;inset:0;background:#0f2038;display:none;align-items:center;justify-content:center;z-index:999;}
#loginView.show{display:flex;}
.login-box{background:#fff;border-radius:12px;padding:34px 38px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.login-box .logo-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.login-box h2{font-size:18px;color:var(--side);}
.login-box .sub{font-size:12px;color:var(--muted);margin-bottom:20px;}
.login-box label{font-size:12px;color:#5b6c80;font-weight:600;display:block;margin:12px 0 4px;}
.login-box input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:6px;font-size:14px;}
.login-box .err{color:var(--red);font-size:12px;min-height:16px;margin-top:8px;}
.login-box button{width:100%;margin-top:16px;padding:10px;background:var(--orange);color:#fff;border:0;border-radius:6px;font-size:14px;cursor:pointer;font-weight:600;}
.login-box button:hover{background:#d35400;}

/* 整体布局 */
#app{display:flex;min-height:100vh;}
#sidebar{width:222px;background:var(--side);color:#d6e2f2;flex-shrink:0;padding:16px 0 40px;position:sticky;top:0;height:100vh;overflow-y:auto;}
#sidebar .brand{display:flex;align-items:center;gap:9px;padding:4px 18px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px;}
.logo{width:30px;height:30px;border-radius:8px;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;font-weight:800;}
#sidebar .brand b{color:#fff;font-size:14px;letter-spacing:.5px;}
#sidebar .grp{font-size:10.5px;letter-spacing:1px;color:#8aa5c6;padding:10px 18px 5px;font-weight:700;}
#sidebar .item{display:flex;align-items:center;gap:8px;padding:7px 18px;color:#cfdcf0;cursor:pointer;font-size:13px;border-left:3px solid transparent;}
#sidebar .item:hover{background:rgba(255,255,255,.07);}
#sidebar .item.active{background:rgba(255,255,255,.12);border-left-color:var(--orange);color:#fff;font-weight:600;}
#sidebar .item .ic{opacity:.75;font-size:12px;width:16px;text-align:center;}
#sidebar .foot{position:sticky;bottom:0;padding:12px 18px;font-size:12px;color:#8aa5c6;background:var(--side);}

#main{flex:1;padding:24px 30px;min-width:0;}
#pageTitle{color:var(--blue);font-size:24px;font-weight:700;margin-bottom:2px;}
#pageSub{color:var(--muted);font-size:13px;margin-bottom:16px;}
.topbar2{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.topbar2 .grow{flex:1;}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 13px;font-size:13px;cursor:pointer;color:var(--text);}
.btn:hover{background:#f2f6fa;}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600;}
.btn.primary:hover{background:#d35400;}
.btn.danger{color:var(--red);border-color:#e5b8b3;}
.btn.small{padding:3px 9px;font-size:12px;}
.btn-ghost{background:transparent;border:0;color:#8aa5c6;cursor:pointer;font-size:12px;}
.btn-ghost:hover{color:var(--blue);}

.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:18px;}
.card h3{font-size:15px;font-weight:700;color:var(--side);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.card h3 .bar{width:4px;height:16px;background:var(--orange);border-radius:2px;display:inline-block;}
.msg{font-size:13px;padding:8px 12px;border-radius:6px;margin-bottom:12px;display:none;}
.msg.ok{background:#e8f7ef;color:var(--green);display:block;}
.msg.err{background:#fdecea;color:var(--red);display:block;}

table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
table.tbl th{text-align:left;padding:9px 12px;color:#5b6c80;font-weight:700;font-size:12px;border-bottom:2px solid var(--line);background:#fff;}
table.tbl td{padding:9px 12px;border-bottom:1px solid #edf0f4;}
table.tbl tr:nth-child(even) td{background:var(--row);}
.mono{font-family:Menlo,Consolas,monospace;font-size:12px;color:#24364c;}
.kv{font-size:13px;width:100%;}
.kv .r{display:flex;border-bottom:1px solid #edf0f4;}
.kv .r:nth-child(even){background:var(--row);}
.kv .r b{width:240px;padding:9px 12px;color:var(--muted);font-weight:600;flex-shrink:0;}
.kv .r span{padding:9px 12px;}
.kv .r span.hl{color:var(--orange);font-weight:800;font-size:16px;}
.kv .r span.green{color:var(--green);font-weight:600;}
.kv .r span.red{color:var(--red);font-weight:600;}
.kv .r span.gray{color:var(--muted);}

input[type=text],input[type=password],select,textarea{padding:8px 11px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:#fff;}
input:focus,select:focus,textarea:focus{outline:2px solid #cfe6f7;border-color:var(--blue);}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.lbl{min-width:110px;color:var(--muted);font-weight:600;font-size:13px;}
.hint{color:var(--muted);font-size:12px;line-height:1.5;flex-basis:100%;}
.radio{display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;margin-right:14px;}
.switch{position:relative;display:inline-block;width:36px;height:20px;}
.switch input{opacity:0;width:0;height:0;}
.sl{position:absolute;inset:0;background:#c3ccd6;border-radius:20px;transition:.2s;cursor:pointer;}
.sl:before{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
.switch input:checked + .sl{background:var(--green);}
.switch input:checked + .sl:before{transform:translateX(16px);}
code{background:#eef2f6;padding:1px 5px;border-radius:4px;font-size:12px;}
pre.log{font-family:Menlo,Consolas,monospace;font-size:11.5px;background:#0f2038;color:#b8d0ea;padding:14px;border-radius:8px;white-space:pre-wrap;word-break:break-all;max-height:480px;overflow-y:auto;line-height:1.5;}
.banner{background:#d6eaf8;color:#1f5b8f;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:flex;gap:10px;align-items:center;}
.banner .x{margin-left:auto;cursor:pointer;font-weight:700;}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.badge.green{background:#e8f7ef;color:var(--green);}
.badge.red{background:#fdecea;color:var(--red);}
.badge.gray{background:#eef1f5;color:#5b6c80;}
.empty{color:var(--muted);padding:20px;text-align:center;font-size:13px;}
canvas#monCanvas{width:100%;height:260px;border:1px solid var(--line);border-radius:8px;background:#fff;}
</style>
</head>
<body>

<div id="loginView" class="show">
  <div class="login-box">
    <div class="logo-row"><div class="logo">OV</div><h2>OpenVPN Access Server</h2></div>
    <div class="sub" id="loginSub">管理后台登录 · Sign in to the admin UI</div>
    <label id="lbUser">用户名 / Username</label>
    <input type="text" id="lgUser" value="admin">
    <label id="lbPass">密码 / Password</label>
    <input type="password" id="lgPass">
    <div class="err" id="lgErr"></div>
    <button id="lgBtn">登录 / Sign In</button>
  </div>
</div>

<div id="app">
  <div id="sidebar">
    <div class="brand"><div class="logo">OV</div><b>OPENVPN<br>Access Server</b></div>
    <div id="menu"></div>
    <div class="foot" id="sideFoot"></div>
  </div>
  <div id="main">
    <div class="topbar2">
      <div>
        <div id="pageTitle">Status Overview</div>
        <div id="pageSub"></div>
      </div>
      <div class="grow"></div>
      <button class="btn" id="langBtn">中文 / English</button>
      <button class="btn" id="outBtn">Logout</button>
    </div>
    <div class="banner" id="banner" style="display:none"><span>🛈</span><span id="bannerTxt"></span><span class="x" onclick="this.parentNode.style.display='none'">×</span></div>
    <div id="content"></div>
  </div>
</div>

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtBytes(b){b=+b||0; if(b>=1048576)return (b/1048576).toFixed(1)+' MB'; if(b>=1024)return (b/1024).toFixed(1)+' KB'; return b+' B';}
function fmtSince(t){if(!t||t==='-')return '-'; var s=Math.max(0,Math.floor(Date.now()/1000 - t)); var d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60); return (d?d+'d ':'')+(h?h+'h ':'')+m+'m';}

/* ===== 认证 ===== */
var auth = localStorage.getItem('ovpn_auth') || '';
function setAuth(p){auth='Basic '+btoa('admin:'+p);localStorage.setItem('ovpn_auth',auth);}
function api(url,method,body){
  return fetch(url,{method:method||'GET',headers:{'Authorization':auth,'Content-Type':'application/json'},
    body:body?JSON.stringify(body):undefined}).then(function(r){
    if(r.status===401){showLogin();throw new Error('401');}
    return r.json().catch(function(){return {ok:false};});
  });
}
function showLogin(){
  if(document.getElementById('loginView').className.indexOf('show')<0){
    document.getElementById('loginView').className='show';
  }
}
document.getElementById('lgBtn').onclick=function(){
  var u=document.getElementById('lgUser').value.trim(), p=document.getElementById('lgPass').value;
  setAuth(p);
  fetch('/api/overview',{headers:{'Authorization':auth}}).then(function(r){
    if(r.status===200){document.getElementById('loginView').className='';document.getElementById('lgErr').textContent='';loadApp();}
    else{document.getElementById('lgErr').textContent=T('err.login');}
  }).catch(function(){document.getElementById('lgErr').textContent=T('err.login');});
};

var curPage='overview';

function pageAuth(){
  var el=document.getElementById('content');

   +'<div class="hint" style="margin-bottom:12px">'+T('au.note')+'</div>'

   +['local','pam','radius','ldap','saml'].map(function(m){return '<label class="radio"><input type="radio" name="auM" value="'+m+'"> '+T('au.'+m)+'</label>';}).join('')+'</div>'
   +'<div id="auExtra"></div>'
   +'<button class="btn primary" id="auSave">'+T('au.save')+'</button></div>';
  api('/api/auth-settings').then(function(d){
    if(!d||!d.ok)return;var a=d.auth;

        +'<div class="row"><label class="lbl">'+T('au.rs')+'</label><input type="text" id="auRS" value="'+esc(a.radius_secret||'')+'" style="width:240px"></div>'
        +'<div class="row"><label class="lbl">'+T('au.rp')+'</label><input type="text" id="auRP" value="'+esc(a.radius_port||'1812')+'" style="width:120px"></div>';
    } else if(a.method==='ldap'){

        +'<div class="row"><label class="lbl">'+T('au.lb')+'</label><input type="text" id="auLB" value="'+esc(a.ldap_bind||'')+'" style="width:240px"></div>'

    var m=document.querySelector('input[name=auM]:checked');if(!m)return;
    var body={method:m.value};

      var e=document.getElementById('au'+k);if(e)body[(k==='RH'?'radius_host':k==='RS'?'radius_secret':k==='RP'?'radius_port':k==='LH'?'ldap_host':k==='LB'?'ldap_bind':k==='LB2'?'ldap_base':k==='SH'?'saml_idp':'saml_entity')]=e.value;

      showMsg('auMsg',!!(d&&d.ok),d&&d.ok?T('msg.ok'):T('msg.err')+(d&&d.error||''));
    });
  };
}

/* monitor */
var monHist={cpu:[],mem:[],conn:[]};
function pageMonitor(){
  var el=document.getElementById('content');
  el.innerHTML='<div class="card"><h3><span class="bar"></span>'+T('mo.title')+'</h3>'
   +'<div class="row" id="moLegend"><label class="radio"><input type="radio" name="moK" value="cpu" checked> '+T('mo.cpu')+' (%)</label>'
   +'<label class="radio"><input type="radio" name="moK" value="mem"> '+T('mo.mem')+' (%)</label>'
   +'<label class="radio"><input type="radio" name="moK" value="conn"> '+T('mo.conn')+'</label>'
   +'<button class="btn" id="moRf">'+T('db.refresh')+'</button></div>'
   +'<canvas id="monCanvas"></canvas>'
   +'<div style="margin-top:8px;font-size:12px;color:var(--muted)" id="moNet">'+T('mo.net')+': -</div></div>';
  var timer=null;
  function sample(){
    api('/api/monitor').then(function(d){
      if(!d||!d.ok)return;
      var m=d.monitor;
      monHist.cpu.push(m.cpu);if(monHist.cpu.length>40)monHist.cpu.shift();
      monHist.mem.push(m.mem);if(monHist.mem.length>40)monHist.mem.shift();
      monHist.conn.push(m.connections);if(monHist.conn.length>40)monHist.conn.shift();
      var net=Object.keys(m.net||{}).map(function(k){return k+': ↓'+m.net[k].rx+' ↑'+m.net[k].tx+' KB/s';}).join(' &nbsp; ');
      document.getElementById('moNet').innerHTML=T('mo.net')+': '+(net||'-');
      draw();
    }).catch(function(){});
  }
  function draw(){
    var k=document.querySelector('input[name=moK]:checked');if(!k)return;
    var key=k.value;var cv=document.getElementById('monCanvas');if(!cv)return;
    var ctx=cv.getContext('2d');var W=cv.width=cv.clientWidth*2,H=cv.height=260*2;
    ctx.clearRect(0,0,W,H);
    var data=monHist[key];if(data.length<2)return;
    var max=Math.max.apply(null,data)*1.1||1;
    ctx.strokeStyle='#e67e22';ctx.lineWidth=2;ctx.beginPath();
    data.forEach(function(v,i){
      var x=i/(39)*(W-20)+10, y=H-10-(v/max)*(H-40);
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    });
    ctx.stroke();
    ctx.fillStyle='#5b6c80';ctx.font='12px sans-serif';
    ctx.fillText((key==='cpu'?T('mo.cpu'):key==='mem'?T('mo.mem'):T('mo.conn'))+' 当前: '+data[data.length-1]+(key==='conn'?'':'%'),10,20);
    ctx.strokeStyle='#dde3ea';ctx.beginPath();ctx.moveTo(10,H-10);ctx.lineTo(W-10,H-10);ctx.stroke();
  }
  document.querySelectorAll('input[name=moK]').forEach(function(r){r.onchange=draw;});
  document.getElementById('moRf').onclick=function(){clearInterval(timer);sample();timer=setInterval(sample,3000);};
  sample();timer=setInterval(sample,3000);
  window.addEventListener('beforeunload',function(){if(timer)clearInterval(timer);});
}
